# Local run: docker compose up --build
# React -> gateway -> services -> Postgres. Only the frontend, gateway and Postgres are published to the host.
# Database settings shared by every service (merged with <<: *db-env).
x-db-env: &db-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reddit}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reddit}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reddit_local}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reddit}
      POSTGRES_USER: ${POSTGRES_USER:-reddit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reddit_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      <<: *db-env
      APP_JWT_GENERATE_KEY: "true"   # local only, see docs/production-changes.md
      APP_OAUTH_GATEWAY_CLIENT_SECRET: local-gateway-secret   # local only; the gateway gets the same value
    depends_on:
      postgres:
        condition: service_healthy

  community-service:
    build: ./community-service
    environment:
      <<: *db-env
      APP_MOCKAUTH_ENABLED: "true"   # local only, see docs/production-changes.md
    depends_on:
      postgres:
        condition: service_healthy

  moto:
    image: motoserver/moto:5.2.5

  post-service:
    build: ./post-service
    environment:
      <<: *db-env
      APP_S3_ENDPOINT: http://moto:5000
    depends_on:
      postgres:
        condition: service_healthy
      moto:
        condition: service_started

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      <<: *db-env   # sessions live in Postgres (schema gateway)
      AUTH_SERVICE_URL: http://auth-service:8081
      COMMUNITY_SERVICE_URL: http://community-service:8082
      POST_SERVICE_URL: http://post-service:8083
      APP_OAUTH_GATEWAY_CLIENT_SECRET: local-gateway-secret   # local only; the same value as auth-service's
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      community-service:
        condition: service_started
      post-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  postgres-data:
