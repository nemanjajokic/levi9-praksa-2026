# Tests that start the whole app need a CommunityDirectory; community-service's /internal endpoints don't exist yet.
# Same exceptions as docker-compose: community 999 is unavailable, user 999 is a member of nothing.
# Kept here (not per test class) so all integration tests share one Spring context and one set of containers.
app.community-stub.enabled=true
app.community-stub.unavailable-community-ids=999
app.community-stub.non-member-user-ids=999
